<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="presentation">
  <!-- Pictogramme décoratif du SDCD, en remplacement du pictogramme DSFR retiré.
       Couleurs figées en dur : servi par <img>, donc hors de portée des variables CSS.
       Teintes : --sdcd-bleu-action #00729A et --sdcd-jaune #FFF24B. -->
  <rect x="10" y="18" width="60" height="52" rx="4" fill="#FFF24B" opacity=".18"/>
  <rect x="10" y="18" width="60" height="52" rx="4" fill="none" stroke="#00729A" stroke-width="4"/>
  <line x1="10" y1="34" x2="70" y2="34" stroke="#00729A" stroke-width="4"/>
  <line x1="26" y1="10" x2="26" y2="24" stroke="#00729A" stroke-width="5" stroke-linecap="round"/>
  <line x1="54" y1="10" x2="54" y2="24" stroke="#00729A" stroke-width="5" stroke-linecap="round"/>
  <rect x="22" y="44" width="10" height="10" rx="1.5" fill="#00729A"/>
  <rect x="48" y="44" width="10" height="10" rx="1.5" fill="#FFF24B" stroke="#00729A" stroke-width="2"/>
</svg>
