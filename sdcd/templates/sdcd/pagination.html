{% load sdcd_tags i18n %}
{% translate "Pagination" as pagination_label %}
{% translate "Page" as page_label %}
<nav role="navigation" class="sdcd-pagination" aria-label="{{ pagination_label }}">
  <a class="sdcd-pagination__lien"
     {% if page_obj.has_previous %}href="?{% url_remplace_params page=page_obj.previous_page_number %}"{% else %}aria-disabled="true"{% endif %}>
    <i class="ri-arrow-left-s-line" aria-hidden="true"></i><span class="sdcd-lecteur-seul">{% translate "Page précédente" %}</span>
  </a>
  {% for item in page_obj.pages_list %}
    {% if item == "…" %}
      <span class="sdcd-pagination__lien" aria-hidden="true">…</span>
    {% else %}
      <a class="sdcd-pagination__lien"
         {% if item == page_obj.number %}aria-current="page"{% endif %}
         title="{{ page_label }} {{ item }}"
         href="?{% url_remplace_params page=item %}">{{ item }}</a>
    {% endif %}
  {% endfor %}
  <a class="sdcd-pagination__lien"
     {% if page_obj.has_next %}href="?{% url_remplace_params page=page_obj.next_page_number %}"{% else %}aria-disabled="true"{% endif %}>
    <i class="ri-arrow-right-s-line" aria-hidden="true"></i><span class="sdcd-lecteur-seul">{% translate "Page suivante" %}</span>
  </a>
</nav>
