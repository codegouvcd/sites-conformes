<div class="sdcd-champ{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}">
  <label class="sdcd-champ__label" for="{{ self.id }}">{{ self.label }}</label>
  <input class="sdcd-input__champ" type="{{ self.type|default:'text' }}" id="{{ self.id }}" name="{{ self.id }}"
         {% if self.value %}value="{{ self.value }}"{% endif %}
         {% if self.min %}min="{{ self.min }}"{% endif %}
         {% if self.max %}max="{{ self.max }}"{% endif %}
         {% if self.onchange %}onchange="{{ self.onchange }}"{% endif %}>
</div>
