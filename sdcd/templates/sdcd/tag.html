{% load i18n %}
{% if self.link %}
  <a class="sdcd-tag sdcd-tag--cliquable{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}" href="{{ self.link }}">{{ self.label }}</a>
{% elif self.is_selectable %}
  <button type="button" class="sdcd-tag sdcd-tag--cliquable{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}"
          aria-pressed="{% if self.is_selected %}true{% else %}false{% endif %}">
    {% if self.is_selected %}<i class="sdcd-tag__coche ri-check-line" aria-hidden="true"></i>{% endif %}{{ self.label }}
  </button>
{% elif self.is_dismissable %}
  <button type="button" class="sdcd-tag sdcd-tag--cliquable{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}">
    {{ self.label }}<i class="sdcd-tag__retirer ri-close-line" aria-hidden="true"></i>
    <span class="sdcd-lecteur-seul">{% translate "Retirer" %}</span>
  </button>
{% else %}
  <p class="sdcd-tag{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}">{{ self.label }}</p>
{% endif %}
