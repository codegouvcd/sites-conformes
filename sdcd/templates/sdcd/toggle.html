{# Interrupteur. Le CSS pilote l'apparence par aria-checked sur la piste ;
   sdcd.js pose l'attribut au clic. Un <button role="switch"> et non une case
   a cocher : c'est ce que le style attend, et le motif ARIA correspondant. #}
<div class="sdcd-champ{% if self.extra_classes %} {{ self.extra_classes }}{% endif %}">
  <label class="sdcd-toggle" for="{{ self.id }}">
    <button type="button" class="sdcd-toggle__piste" role="switch"
            id="{{ self.id }}" name="{{ self.name|default:self.id }}"
            aria-checked="{% if self.is_checked %}true{% else %}false{% endif %}"
            {% if self.is_disabled %}disabled{% endif %}>
      <span class="sdcd-toggle__pastille" aria-hidden="true"></span>
    </button>
    <span>{{ self.label }}</span>
  </label>
  {% if self.help_text %}<p class="sdcd-champ__aide">{{ self.help_text }}</p>{% endif %}
</div>
