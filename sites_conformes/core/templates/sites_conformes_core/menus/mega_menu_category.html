{% load menu_tags %}
{% if menu_items %}
  <ul class="sdcd-dropdown__liste">
    {% for item in menu_items %}
      <li>
        <a class="sdcd-header__lien"
           href="{{ item.href }}"
           {% if item.href == request.path %}aria-current="page"{% endif %}
           target="_self">{{ item.text }}</a>
      </li>
    {% endfor %}
  </ul>
{% endif %}
