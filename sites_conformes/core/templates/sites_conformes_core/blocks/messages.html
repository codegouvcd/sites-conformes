{# Display Django message info from previous form #}
{% if messages %}
  <div class="sdcd-conteneur sdcd-mt-7 cmsfr-block-messages">
    <div class="sdcd-grille sdcd-grille--gouttieres">
      <div class="sdcd-col-12">
        {% for message in messages %}
          {% if message.tags == "success" %}
            <div class="sdcd-alert sdcd-alert--succes sdcd-alert--sm sdcd-mb-7"
                 role="status">
              <p>{{ message }}</p>
            </div>
          {% elif message.tags == "info" %}
            <div class="sdcd-alert sdcd-alert--info sdcd-alert--sm sdcd-mb-7" role="status">
              <p>{{ message }}</p>
            </div>
          {% elif message.tags == "error" %}
            <div class="sdcd-alert sdcd-alert--erreur sdcd-alert--sm sdcd-mb-7" role="alert">
              <p>{{ message }}</p>
            </div>
          {% endif %}
        {% endfor %}
      </div>
    </div>
  </div>
{% endif %}
