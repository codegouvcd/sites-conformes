{% load static wagtailcore_tags wagtailimages_tags %}
<div style="{% if value.layout.background_color %}background-color: var(--background-alt-{{ value.layout.background_color }});
            {% endif %} min-height: 350px">
  <div class="sdcd-conteneur sdcd-py-5">
    <div class="sdcd-grille sdcd-grille--milieu sdcd-grille--centre {{ value.layout.vertical_margin }}">
      <div class="sdcd-col-md-6 {% if value.text_content.position == 'right' %} cmsfr-order__2 sdcd-pl-md-6 {% else %} sdcd-pr-md-6 {% endif %}">
        {% include "sites_conformes_core/heros/_hero_text_content.html" %}
        {% include "sites_conformes_core/heros/_hero_buttons.html" %}
      </div>
       <div class="sdcd-col-md-6">
      {% image value.image fill-600x600 as header_image %}
      <img class="sdcd-image-fluide"
           src="{{ header_image.full_url }}"
           alt="{{ header_image.alt }}" />
    </div>
    </div>
   
  </div>
</div>
