{% load wagtailcore_tags %}
<button{% if current_page.url in self.menu_urls %} aria-current="true"{% endif %} aria-expanded="false" aria-controls="{{ self.id }}" type="menu" class="sdcd-header__lien">{{ self.label }}</button>
<div class="sdcd-repli sdcd-dropdown__menu" id="{{ self.id }}">
  <ul class="sdcd-dropdown__liste">
    {% for link in self.links %}
      <li class="sdcd-nav__item">
        {% include_block link %}
      </li>
    {% endfor %}
  </ul>
</div>
